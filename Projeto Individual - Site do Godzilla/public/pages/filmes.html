<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/filmes.css">
</head>

<body>
    <header>
        <div class="logo">
            <!-- Imagem retirada de -> https://www.deviantart.com/goji25/art/Godzilla-Minus-One-Logo-1058770268 -->
            <img src="../img/logo.png" alt="">
            <p class="titulo">Gojira View</p>
        </div>

        <div class="links">
            <a href="dashboard.html" class="escolhaLinks dashboard" id="dashboard"></a>
            <a href="quiz.html" class="escolhaLinks quiz" id="quiz"></a>
            <a href="../index.html" class="escolhaLinks">Home</a>
            <a href="filmes.html" class="escolhaLinks active">Filmes</a>
            <a href="trajes.html" class="escolhaLinks">Trajes</a>
            <a href="login.html" class="escolhaLinks login" id="login">Login</a>
        </div>
    </header>
    <main>
        <section class="filmesContainer">
            <div class="filmeTítulo" id="filmeTitulo"></div>
            <div class="imagemFilme" id="imagemFilme"></div>
            <div class="botoesNavegacao">
                <button class="btnVoltar" onclick="previousSlide()">← Voltar</button>
                <button class="btnAvancar" onclick="nextSlide()">Avançar →</button>
            </div>
            <div class="textoFilme" id="textoFilme"></div>
            <div class="avisoSpoiler">Atenção: o conteúdo abaixo contém spoilers</div>
            <div class="textoSpoiler" id="textoSpoiler"></div>
            <div class="trailerFilme" id="trailerFilme"></div>
        </section>
    </main>

    <footer>
        <div class="footerContainer">
            <p class="footerCopy">
                © 2026 Gojira View. Desenvolvido por Matheus Maceu. Todos os direitos reservados.
            </p>

            <p class="footerDisclaimer">
                Godzilla e todos os elementos relacionados são © Toho Co., Ltd.
                Este é um projeto acadêmico sem fins comerciais.
            </p>
        </div>
    </footer>
    <script src="../js/finalizarLogin.js"></script>
    <script src="../js/filmes2.js"></script>
    <script src="../js/filmes.js"></script>
</body>

</html>
