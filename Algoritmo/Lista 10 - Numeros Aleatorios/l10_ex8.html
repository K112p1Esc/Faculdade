<!-- 8. Crie um programa o qual:  
a) Tenha um botão "Gerar uma nota de aluno entre 0 e 10" que faz aparecer, abaixo dele, a nota gerada  

b) Tenha um botão "Gerar uma frequência de aluno entre 0 e 100" que faz aparecer, abaixo dele, a frequência gerada  

c) Deixe todos os valores com 2 casas decimais na tela  

d) Ao clicar no botão “Ver Situação", emitir um alerta com a situação desse aluno.  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="notaF()">Gerar uma nota de aluno entre 0 e 10</button>
    <div id="notaMsg"></div>
    <button onclick="frequenciaF()">Gerar uma frequência de aluno entre 0 e 100</button>
    <div id="freqMsg"></div>
    <button onclick="situacao()">Ver Situação</button>
    <div id="situacaoMsg"></div>
</body>

</html>

<script>
    let nota = null;
    let frequencia = null;
    function notaF() {
        nota = Math.random() * 11;
        if (nota > 10) {
            nota = parseInt(nota);
        } else {
            nota = nota.toFixed(2);
        }
        notaMsg.innerHTML = nota;
    }

    function frequenciaF() {
        frequencia = Math.random() * 101;
        if (frequencia > 100) {
            frequencia = parseInt(frequencia);
        } else {
            frequencia = frequencia.toFixed(2);
        }
        freqMsg.innerHTML = frequencia;
    }

    function situacao() {
        let aprovado = 'Não'
        if (nota == null || frequencia == null){
            alert('gere a nota e frequencia primeiro')
        }else{
            alert(`Situacao Atual:
            Nota:${nota}
            Frequência:${frequencia}`);
        }
    }
</script>
