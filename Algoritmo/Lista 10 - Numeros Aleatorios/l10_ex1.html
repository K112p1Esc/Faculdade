<!-- 1. Crie um programa o qual:  
a) Ao clicar em um botão "Sortear", apareça na página um número aleatório, entre 0 e 0.9999;  

b) Se esse número for maior que 0.5, exibir, abaixo, a frase "Eu arredondaria para 1".  Caso contrário, exiba "Eu arredondaria para 0".  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sorteio()">Sortear</button>
    <div id="msg"></div>
</body>
</html>

<script>
    function sorteio() {
        let random = Math.random();
        let mensagem = '';

        mensagem += random.toFixed(4) + '<br>'
        if (random > 0.5){
            mensagem += 'Eu arredondaria para 1'
        }else {
            mensagem += 'Eu arredondaria para 0'
        }

        msg.innerHTML = mensagem;
    }
</script>
