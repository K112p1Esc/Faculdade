<!-- 4. Crie um programa o qual:  
a) Ao clicar no botão "Sortear Nota para aluno", apareça na página um número aleatório, entre 0 e 10 (podem ser sorteados números decimais com uma casa decimal, como "8.5", por exemplo).  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sortear()">Sortear nota para aluno</button>
    <div id="msg"></div>
</body>
</html>

<script>
    function sortear() {
        let random = Math.random()*10.05 //só por que se não, é impossível 10, as vezes pode cair tipo, 9.95 e arredondar para 10!
        msg.innerHTML = random.toFixed(1);
    }
</script>
