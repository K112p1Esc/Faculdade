<!-- 18. Crie um programa que simule um jogo de dados, o qual:  
a) Tenha o seguinte texto:  

   Jogador 1: 0  

   Jogador 2: 0  

   Empate: 0  

b) Ao clicar no botão “Jogar”, sorteie um valor de 1 a 6 para o Jogador 1 e outro valor para o Jogador 2 e some 1 no placar do item a) de acordo com o resultado.  

c) Após atualizar o placar, emita a mensagem "O jogador X está vencendo!", onde X é o jogador que está vencendo. Caso o jogo esteja empatado, a mensagem será "O jogo está empatado!"  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Jogador 1: <span id="joga1">0</span>
    <br>
    Jogador 2: <span id="joga2">0</span>
    <br>
    Empate: <span id="empatado">0</span>
    <button onclick="jogar()">Jogar</button>
    <div id="msg"></div>
</body>

</html>

<script>
    let jog1 = null;
    let jog2 = null;
    let empate = 0;
    let jogador1 = 0;
    let jogador2 = 0;
    function jogar() {
        jog1 = parseInt((Math.random() * 6 + 1));
        jog2 = parseInt((Math.random() * 6 + 1));
        if (jog1 == jog2) {
            msg.innerHTML = `empate`
            empate++
            empatado.innerHTML = empate
        } else if (jog1 > jog2) {
            msg.innerHTML = `Jogador 1 venceu`
            jogador1++
            joga1.innerHTML = jogador1
        }
         else {
            msg.innerHTML = `Jogador 2 venceu`
            jogador2++
            joga2.innerHTML = jogador2
        }
    }
</script>
