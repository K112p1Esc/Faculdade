<!-- 3. Crie um programa o qual:  
a) Tenha um botão "jogar dado";  

b) Ao clicar nele, sorteie um dos 20 números de um dado D20 (Google) e exiba o número sorteado em um quadrado com fundo preto, contendo a letra branca e o número centralizado dentro do quadrado (100px de largura e altura é suficiente);  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="d20()">Jogar um Dado</button>
    <div id="msg" style="color:white; background-color: black; width: 100px; height: 100px; display: flex; justify-content: center; align-items:center;">
        d20
    </div>
</body>
</html>

<script>
    function d20() {
        let random = parseInt(Math.random()*20+1)
        msg.innerHTML = random;
    }
</script>
