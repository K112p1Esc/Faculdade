<!-- 4. Cadastro de Filmes com Classificação
Crie um programa o qual:

a) O usuário informe:

nome do filme;
gênero;
nota;
b) Ao clicar em "Cadastrar Filme", crie um objeto JSON chamado filme;

c) Verifique a nota do filme:

se for maior ou igual a 8, crie o atributo classificacao com valor "Filme Excelente";
caso contrário, "Filme Regular".
d) Exiba:

Filme: Interestelar
Gênero: Ficção
Nota: 9
Classificação: Filme Excelente -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Nome do Filme
    <input type="text" id="nomeFilme"> <br>
    Genero do Filme
    <input type="text" id="generoFilme"> <br>
    Nota do Filme
    <input type="text" id="notaFilme"> <br>
    <button onclick="cadastrar()">Cadastrar Filme</button>
    <div id="msg"></div>
</body>
</html>

<script>
    function cadastrar() {
        let filme = {
            nome: nomeFilme.value,
            genero: generoFilme.value,
            nota: notaFilme.value
        }

        filme.classificacao = 'Filme regular'
        if(filme.nota >= 8) {
            filme.classificacao = 'Filme Excelente'
        }
        msg.innerHTML = `
            Filme: ${filme.nome} <br>
            Gênero: ${filme.genero} <br>
            Nota: ${filme.nota} <br>
            Classificação: ${filme.classificacao} <br>
        `
    }
</script>
