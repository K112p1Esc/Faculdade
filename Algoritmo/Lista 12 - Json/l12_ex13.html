<!-- 2. Registro de Produtos
Crie um programa o qual:  

a) Pergunte ao usuário o preço e o nome de um produto; 

b) Ao clicar em "Cadastrar", caso o preço seja positivo e o nome contenha ao menos 3 letras, registra as informações num lugar que o usuário não vê e exibe uma mensagem de sucesso. Caso contrário, exibe uma mensagem explicativa; 

c) Ao clicar em "Atualizar Estoque", deve aparecer a lista de preços e o nome dos produtos cadastrados e  um texto como este abaixo:  

     Você tem AAA produtos cadastrados em estoque:

     1. BBB - R$CCC 

     2. BBB - R$CCC  

     Seu estoque vale R$DDD 

Em AAA é a quantidade de produtos cadastrados pelo usuário, BBB o nome do produto, CCC o preço do produto e DDD é a soma de todos os valores. 

d) Tenha uma select com as opções "Preços acima de" e "Preços abaixo de" e um campo "Valor".

e) Ao clicar no botão "Filtrar Produtos", deve exibir a lista de produtos filtrada de acordo com o valor informado no campo e a opção selecionada.

OBS: caso escolha "Preços acima de" e o valor seja "20", deve exibir somente produtos cadastrados com preço acima de 20
 -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Insira um preço
    <input type="text" id="precoProduto"> <br>
    Insira um nome do Produtos
    <input type="text" id="nomeProduto"> <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="atualizar()">Atualizar</button>
    <br>
    <select name="" id="selectProduto">
        <option value="abaixo">Abaixo de</option>
        <option value="acima">Acima de</option>
    </select>
    Insira valor
    <input type="text" id="valorProduto">
    <br>
    <button onclick="filtrar()">Filtrar</button>
    <div id="msg"></div>
</body>

</html>

<script>
    let lista = []
    function cadastrar() {
        if ((nomeProduto.value).length >= 3 && precoProduto.value > 0) {
            let json = {
                preco: Number(precoProduto.value),
                nome: nomeProduto.value
            }
            lista.push(json);
            msg.innerHTML = 'Sucesso no cadastro'
        } else {
            msg.innerHTML = `O ${nomeProduto.value} tem apenas ${(nomeProduto.value).length} ao invés de no mínimo 3 OU ${precoProduto.value} não é positivo`
        }
    }

    function atualizar() {
        let quantia = lista.length;
        let mssg = '';
        let soma = 0;
        for (let i = 0; i < quantia; i++) {
            mssg += `${i + 1}. ${lista[i].nome} - R$${lista[i].preco} <br><br>`
            soma += lista[i].preco
        }

        msg.innerHTML = `
            Você tem ${quantia} produtos cadastrados em estoque<br><br>
            ${mssg}
            Seu estoqeu vale $${soma}
        `
    }

    function filtrar() {
        let comparo = Number(valorProduto.value)
        let contador = 0;
        let mssg = '';
        let soma = 0;
        if (selectProduto.value == 'abaixo') {
            for (let i = 0; i < lista.length; i++) {
                if (lista[i].preco < comparo) {
                    contador++;
                    soma += lista[i].preco;
                    mssg += `${contador}. ${lista[i].nome} - R$${lista[i].preco} <br><br>`
                }
            }
            msg.innerHTML = `
                Você tem ${contador} produtos cadastrados em estoque de acordo com filtro<br><br>
                ${mssg}
                Seu s vale $${soma}
            `
        } else {
            for (let i = 0; i < lista.length; i++) {
                if (lista[i].preco > comparo) {
                    contador++;
                    soma += lista[i].preco;
                    mssg += `${contador}. ${lista[i].nome} - R$${lista[i].preco} <br><br>`
                }
            }
            msg.innerHTML = `
                Você tem ${contador} produtos cadastrados em estoque<br><br>
                ${mssg}
                Seu estoqeu vale $${soma}
            `
        }
    }
</script>
