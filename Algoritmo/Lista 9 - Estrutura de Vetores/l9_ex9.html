<!-- 9. Registro de Números com Histórico, Maior e Menor Valor
Crie um programa o qual:  
a) Tenha um campo "Digite um número qualquer";  

b) Tenha um botão "Analisar histórico" que ao ser clicado, o número é cadastrado em algum lugar e, em seguida, deve aparecer um histórico dos números cadastrados, bem como o maior e o menor, como no exemplo a seguir:  

   1º Número: 15  

   2º Número: 22  

   3º Número: 19  

   4º Número: 5  

   Maior: 22  

   Menor: 5   -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="numeroQualquer">Digite um númeor qualuqer</label>
    <input type="text" id="numeroQualquer">
    <button onclick="analisar()">Analisar histórico</button>
    <div id="msg"></div>
</body>
</html>

<script>
    let numero = [];
    function analisar() {
        numero.push(Number(numeroQualquer.value));
        let maior = 0;
        let menor = numero[0]
        let mssg = '';
        
        for(let i = 0; i<numero.length;i++){
            mssg+=`${i+1}º Número: ${numero[i]}<br>`
            if(maior < numero[i]){
                maior = numero[i];
            }
            if(menor > numero[i]){
                menor = numero[i];
            }
        }
        mssg+=`Maior: ${maior}<br>Menor:${menor}`
        msg.innerHTML = mssg;
    }
</script>
