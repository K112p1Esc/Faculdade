<!-- 4. Cadastro de Projetos e Classificação de Experiência Profissional
Crie um programa o qual: 
a) Pergunte ao usuário o nome de cada projeto que já criou na vida. Ele digita e clica em "Registrar projeto". Na medida em que vai cadastrando, verifique quantos projetos já foram cadastrados e exiba o seguinte texto abaixo:  

     Você já fez X projetos. Por isso você é um profissional Z  

     X é a quantidade de projetos e Z é seu nível de experiência, segundo estas regras:  

     0 a 4: Júnior  

     5 a 12: Pleno  

     13 ou mais: Sênior  

b)  Tenha um botão “Mostrar Projetos” que quando clicado mostra os projetos cadastrados, um abaixo do outro, em ordem inversa ao que foi cadastrado.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="nomeProjeto">Qual nome dos projetos que já fez?</label>
    <input type="text" name="" id="nomeProjeto">
    <br>
    <button onclick="registrar()">Registrar Projeto</button>
    <div id="msg"></div>
    <button onclick="mostrar()">Mostrar Projetos</button>
    <div id="msg2"></div>
</body>
</html>

<script>
    let projetos = [];
    let projetosTotal = 0;
    function registrar() {
        projetos.push(nomeProjeto.value);
        projetosTotal++;
        let tipo = 'Sênior';
        if (projetosTotal < 5){
            tipo = 'Junior'
        }else if (projetosTotal < 13){
            tipo = 'Pleno'
        }
        msg.innerHTML = `Você já fez ${projetosTotal}. Por isso você é um profissional ${tipo}`
    }

    function mostrar() {
        let mssg = '';
        for(let i = projetos.length-1;i>=0;i--){
            mssg += `${projetos[i]}<br>`
        }
        msg.innerHTML = mssg;
    }
</script>
