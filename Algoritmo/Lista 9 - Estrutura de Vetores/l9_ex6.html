<!-- 6. Controle de Estoque de Produtos com Cálculo de Valor Total
Crie um programa o qual:  
a) Pergunte ao usuário o preço de um produto; 

b) Ao clicar em "Cadastrar", o preço fica cadastrado num lugar que o usuário não vê; 

c) Ao clicar em "Atualizar Estoque", deve aparecer a lista de preços cadastrados (em ordem inversa) e um texto como este abaixo:  

   Você tem X produtos cadastrados em estoque  

   Seu estoque vale R$Y 

Em que X é a quantidade de produtos cadastrados pelo usuário e Y é a soma de todos os valores.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="precoProduto">Qual valor do produto?</label>
    <input type="text" id="precoProduto">
    <button onclick="cadastrar()">cadastrar</button>
    <button onclick="estoque()">Atualizar Estoque</button>
    <div id="msg"></div>
</body>
</html>

<script>
    let produto = [];
    function cadastrar() {
        produto.push(Number(precoProduto.value))
    }
    function estoque() {
        let sum = 0;
        let msg2 = '';
        for(let i = produto.length-1; i>=0;i--){
            msg2 += `R$${produto[i]}<br>`
            sum+= produto[i];
        }
        msg.innerHTML =  `${msg2}<br>Você tem ${produto.length} produtos cadastrados em estoque<br><br>Seu estoque vale R$${sum} `
    }
</script>
