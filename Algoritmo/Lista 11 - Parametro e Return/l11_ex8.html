<!-- 8) Crie uma função que receba um vetor de números e retorne um novo vetor contendo apenas os números pares do vetor original. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="exibir()">Ver os pares de um vetor</button>
    <div id="msg"></div>
</body>
</html>

<script>
    array = [1,3,5,10,15,20,12,0,8]
    function exibir() {
        msg.innerHTML = paresElementos(array);
    }

    function paresElementos(a) {
        let pares = ''
        for(let i = 0; i<a.length;i++){
            if(a[i]%2==0){
                pares += `${a[i]}       `
            }
        }
        return pares;
    }
</script>
