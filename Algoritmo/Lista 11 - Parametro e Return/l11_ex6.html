<!-- 6) Crie uma função que receba um vetor de números e retorne o menor valor presente no vetor. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="exibir()">menor valor</button>
    <div id="msg"></div>
</body>
</html>

<script>
    array = [1,3,5,10,15,20,12,0,8]
    function exibir() {
        msg.innerHTML = menorValor(array);
    }

    function menorValor(a){
        let menor = a[0];

        for(let i = 0; i<a.length;i++){
            if(a[i]< menor){
                menor = a[i];
            }
        }
        return menor;
    }
</script>
