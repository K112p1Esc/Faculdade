<!-- 7) Crie uma função que receba um vetor de números e retorne a média dos valores. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="exibir()">Ver a média de um vetor</button>
    <div id="msg"></div>
</body>
</html>

<script>
    array = [1,3,5,10,15,20,12,0,8]
    function exibir() {
        msg.innerHTML = mediaElementos(array);
    }

    function mediaElementos(a) {
        let media = 0
        for(let i = 0; i<a.length;i++){
            media += a[i];
        }
        media = media/a.length;
        return media;
    }
</script>
